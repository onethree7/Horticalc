[project]
name = "horticalc"
version = "0.1.0"
description = "Horticalc (molar-correct) – CSV/YAML Backend"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "numpy>=1.26.0",
  "pywebview>=5.2",
  "tzdata>=2024.1; platform_system == \"Windows\"",
]

[project.scripts]
horticalc = "horticalc.__main__:main"
horticalc-launcher = "horticalc.launcher:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
