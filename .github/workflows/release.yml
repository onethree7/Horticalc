name: Release Builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v0.6.1"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            app_dir: dist/horticalc
            bin_path: dist/horticalc/horticalc
            archive_ext: tar.gz
          - os: windows-latest
            platform: windows
            app_dir: dist/Horticalc
            bin_path: dist/Horticalc/Horticalc.exe
            archive_ext: zip

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.9"

      - name: Install Linux WebKitGTK build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.1 \
            libcairo2-dev \
            libgirepository1.0-dev \
            pkg-config \
            python3-dev \
            python3-gi \
            python3-gi-cairo

      - name: Install dependencies
        env:
          PIP_CONSTRAINT: constraints-release.txt
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller

      - name: Compute artifact metadata
        id: vars
        shell: bash
        run: |
          package_version="$(python scripts/check_release_version.py)"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="$(git rev-parse --short HEAD)"
          fi
          echo "package_version=${package_version}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "artifact_base=horticalc-${version}-${{ matrix.platform }}" >> "$GITHUB_OUTPUT"

      - name: Build package (Linux)
        if: matrix.platform == 'linux'
        env:
          HORTICALC_VERSION: ${{ steps.vars.outputs.package_version }}
        run: |
          chmod +x scripts/packaging/build_linux.sh
          ./scripts/packaging/build_linux.sh

      - name: Build package (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          HORTICALC_VERSION: ${{ steps.vars.outputs.package_version }}
        run: |
          ./scripts/packaging/build_windows.ps1

      - name: Smoke test packaged binary
        shell: bash
        env:
          BIN_PATH: ${{ matrix.bin_path }}
          APP_ROOT: ${{ matrix.app_dir }}
          HORTICALC_NO_GUI: "1"
        run: |
          python - <<'PY'
          import csv
          import json
          import os
          import subprocess
          import time
          import urllib.request
          from pathlib import Path

          app_root = Path(os.environ["APP_ROOT"]).resolve()
          bin_path = Path(os.environ["BIN_PATH"]).resolve()

          if not bin_path.exists():
              raise SystemExit(f"Packaged binary not found: {bin_path}")

          user_dir = app_root / "user"
          user_dir.mkdir(parents=True, exist_ok=True)
          legacy_fertilizers = user_dir / "fertilizers.csv"
          legacy_fertilizers.write_text(
              "Nr.,Düngername,Form,Gewicht,N\n"
              "1,Legacy Solid,Pulver,1,0.1\n"
              "2,Legacy Liquid,Flüssig,1.25,0.2\n",
              encoding="utf-8",
          )

          env = os.environ.copy()
          env["HORTICALC_NO_GUI"] = "1"

          proc = subprocess.Popen([str(bin_path)], cwd=str(app_root), env=env)
          try:
              lockfile = app_root / "user" / "horticalc.lock.json"
              deadline = time.time() + 30
              while time.time() < deadline and not lockfile.exists():
                  time.sleep(0.5)
              if not lockfile.exists():
                  raise SystemExit(f"Lockfile was not created: {lockfile}")

              data = json.loads(lockfile.read_text(encoding="utf-8"))
              port = data.get("port")
              if not isinstance(port, int):
                  raise SystemExit("Lockfile missing integer port")

              required_paths = [
                  app_root / "frontend",
                  app_root / "frontend" / "index.html",
                  app_root / "data",
                  app_root / "recipes",
                  app_root / "README.txt",
                  app_root / "LICENSE",
              ]
              for path in required_paths:
                  if not path.exists():
                      raise SystemExit(f"Missing expected path: {path}")

              forbidden_renderers = ("pyqt", "pyside", "cefpython", "qtwebengine")
              unexpected = [
                  path for path in app_root.rglob("*")
                  if any(name in path.name.lower() for name in forbidden_renderers)
              ]
              if unexpected:
                  raise SystemExit(f"Unexpected bundled renderer: {unexpected[0]}")

              artifact_bytes = sum(path.stat().st_size for path in app_root.rglob("*") if path.is_file())
              print(f"Packaged application size: {artifact_bytes} bytes")

              logs_dir = app_root / "logs"
              deadline = time.time() + 30
              while time.time() < deadline and not logs_dir.exists():
                  time.sleep(0.5)
              if not logs_dir.exists():
                  raise SystemExit(f"Logs directory was not created: {logs_dir}")

              health_url = f"http://127.0.0.1:{port}/health"
              deadline = time.time() + 30
              while time.time() < deadline:
                  try:
                      with urllib.request.urlopen(health_url, timeout=1) as response:
                          if 200 <= response.status < 300:
                              break
                  except Exception:
                      pass
                  time.sleep(0.5)
              else:
                  raise SystemExit(f"Health check failed: {health_url}")

              legacy_backup = legacy_fertilizers.with_suffix(".csv.legacy-backup")
              overrides = user_dir / "fertilizers_overrides.csv"
              if legacy_fertilizers.exists() or not legacy_backup.exists():
                  raise SystemExit("Legacy fertilizer catalog was not migrated")
              with overrides.open(encoding="utf-8", newline="") as handle:
                  migrated = {
                      row["Düngername"]: row for row in csv.DictReader(handle)
                  }
              solid = migrated.get("Legacy Solid", {})
              liquid = migrated.get("Legacy Liquid", {})
              if solid.get("Liquid") != "0" or float(solid.get("N", "nan")) != 0.1:
                  raise SystemExit("Migrated solid fertilizer is missing")
              if (
                  liquid.get("Liquid") != "1"
                  or float(liquid.get("Gewicht", "nan")) != 1.25
                  or float(liquid.get("N", "nan")) != 0.2
              ):
                  raise SystemExit("Migrated liquid fertilizer is missing")
          finally:
              proc.terminate()
              try:
                  proc.wait(timeout=10)
              except subprocess.TimeoutExpired:
                  proc.kill()
                  proc.wait(timeout=10)
          PY

      - name: Clean smoke-test runtime state
        shell: bash
        run: |
          rm -rf "${{ matrix.app_dir }}/user" "${{ matrix.app_dir }}/logs"
          test ! -e "${{ matrix.app_dir }}/user"
          test ! -e "${{ matrix.app_dir }}/logs"

      - name: Package artifact (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          archive="${{ steps.vars.outputs.artifact_base }}.${{ matrix.archive_ext }}"
          tar -czf "${archive}" -C dist horticalc
          echo "ARCHIVE_PATH=${archive}" >> "$GITHUB_ENV"

      - name: Package artifact (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $archive = "${{ steps.vars.outputs.artifact_base }}.${{ matrix.archive_ext }}"
          Compress-Archive -Path "${{ matrix.app_dir }}" -DestinationPath $archive
          "ARCHIVE_PATH=$archive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compute SHA-256 checksum
        shell: bash
        run: |
          checksum="${ARCHIVE_PATH}.sha256"
          sha256sum "${ARCHIVE_PATH}" > "${checksum}"
          echo "CHECKSUM_PATH=${checksum}" >> "$GITHUB_ENV"

      - name: Attest release archive
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ env.ARCHIVE_PATH }}

      - name: Attest checksum file
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ env.CHECKSUM_PATH }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.vars.outputs.artifact_base }}
          path: |
            ${{ env.ARCHIVE_PATH }}
            ${{ env.CHECKSUM_PATH }}
          if-no-files-found: error

  linux-compatibility:
    name: Linux GUI (${{ matrix.name }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 22.04
            container: ubuntu:22.04
            family: apt
            install_command: sudo apt update && sudo apt install -y libgirepository-1.0-1 gir1.2-webkit2-4.1
          - name: Ubuntu 24.04
            container: ubuntu:24.04
            family: apt
            install_command: sudo apt update && sudo apt install -y libgirepository-1.0-1 gir1.2-webkit2-4.1
          - name: Debian 13
            container: debian:13
            family: apt
            install_command: sudo apt update && sudo apt install -y libgirepository-1.0-1 gir1.2-webkit2-4.1
          - name: Fedora 44
            container: fedora:44
            family: dnf
            install_command: sudo dnf install -y webkit2gtk4.1

    steps:
      - name: Install test harness without WebKitGTK
        shell: bash
        run: |
          if [[ "${{ matrix.family }}" == "apt" ]]; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install --yes \
              dbus-x11 \
              gir1.2-gtk-3.0 \
              libgirepository-1.0-1 \
              openbox \
              python3 \
              xdotool \
              xvfb
          else
            dnf install --assumeyes \
              dbus-x11 \
              gobject-introspection \
              gtk3 \
              openbox \
              python3 \
              xdotool \
              xorg-x11-server-Xvfb
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Linux artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: horticalc-*-linux
          path: downloaded-artifact
          merge-multiple: true

      - name: Extract Linux artifact
        shell: bash
        run: |
          mkdir -p dist
          archive="$(find downloaded-artifact -maxdepth 1 -name 'horticalc-*-linux.tar.gz' -print -quit)"
          test -n "$archive"
          tar -xzf "$archive" -C dist
          python3 scripts/packaging/verify_linux_bundle.py dist/horticalc

      - name: Verify missing-runtime guidance
        shell: bash
        env:
          EXPECTED_COMMAND: ${{ matrix.install_command }}
        run: |
          set +e
          timeout 45s dist/horticalc/horticalc > missing-webkit.log 2>&1
          status=$?
          set -e
          cat missing-webkit.log
          if [[ "$status" -eq 0 || "$status" -eq 124 ]]; then
            echo "Expected an immediate missing-WebKitGTK failure, got status $status" >&2
            exit 1
          fi
          grep --fixed-strings "$EXPECTED_COMMAND" missing-webkit.log
          test ! -e dist/horticalc/user/horticalc.lock.json
          rm -rf dist/horticalc/user dist/horticalc/logs

      - name: Install documented WebKitGTK runtime
        shell: bash
        run: |
          if [[ "${{ matrix.family }}" == "apt" ]]; then
            apt-get install --yes libgirepository-1.0-1 gir1.2-webkit2-4.1
          else
            dnf install --assumeyes webkit2gtk4.1
          fi

      - name: Smoke test native Linux GUI lifecycle
        shell: bash
        run: |
          export DISPLAY=:99
          export XDG_RUNTIME_DIR=/tmp/horticalc-runtime
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          Xvfb "$DISPLAY" -screen 0 1280x800x24 > /tmp/xvfb.log 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
          sleep 2
          dbus-run-session -- bash -c '
            openbox > /tmp/openbox.log 2>&1 &
            python3 scripts/packaging/smoke_linux_gui.py \
              dist/horticalc/horticalc dist/horticalc
          '
          test ! -e dist/horticalc/user/horticalc.lock.json

  publish-release:
    name: Publish release assets
    if: github.ref == 'refs/tags/v0.6.1'
    needs:
      - build
      - linux-compatibility
    runs-on: ubuntu-24.04
    steps:
      - name: Download verified artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true

      - name: Upload release assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            release-assets/*.tar.gz
            release-assets/*.tar.gz.sha256
            release-assets/*.zip
            release-assets/*.zip.sha256
