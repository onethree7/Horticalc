conversion_notes:
  - The solver profile stores only the ionic result; the published compound-level T1 values and stoichiometric audit are recorded in docs/nutrient_solution_profiles.md.
  - Table 7 T1 implies 20.3 mmol/L total N, not the nominal 22.0 mmol/L printed in optimization table 6; this profile follows the actually validated T1 formulation.
  - T1 produced the highest validation shoot fresh weight, 301.02 g, and exceeded the Hoagland control by 40.67 percent.
  - Micronutrients are omitted because the publication does not provide a complete numeric micronutrient composition for T1.
