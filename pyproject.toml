[project]
name = "horticalc"
dynamic = ["version"]
description = "Horticalc (molar-correct) – CSV/YAML Backend"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "fastapi>=0.136.3",
  "pydantic>=2.13.4",
  "uvicorn>=0.49.0",
  "numpy>=1.26.0",
  "scipy>=1.11",
  "tzdata>=2024.1; platform_system == \"Windows\"",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.0.0",
  "pytest>=8",
  "ruff==0.15.21",
  "tomli>=2; python_version < \"3.11\"",
]

[project.scripts]
horticalc = "horticalc.__main__:main"
horticalc-launcher = "horticalc.launcher:main"

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["_docs_backup", "build", "dist", "node_modules", "user"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B017"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "horticalc.__version__"}

[tool.setuptools.data-files]
"frontend" = ["frontend/index.html", "frontend/request_gate.js"]
"frontend/app" = ["frontend/app/*.js"]
"frontend/i18n" = ["frontend/i18n/*.js"]
"frontend/styles" = ["frontend/styles/*.css"]
"data" = ["data/*.csv", "data/*.yml"]
"data/water_profiles" = ["data/water_profiles/*.yml"]
"data/nutrient_solutions" = ["data/nutrient_solutions/*.yml"]
"recipes" = ["recipes/*.yml"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
