conversion_notes:
  - Original T4 values in molc/m3 are NO3 9.000, H2PO4 0.750, SO4 5.250, K 6.375, Ca 5.675, and Mg 2.522.
  - molc/m3 equals meq/L. Monovalent ions retain the numeric value in mmol/L; divalent SO4, Ca, and Mg are divided by two.
  - Sulfate molarity becomes equal elemental-S molarity, not sulfate mass.
  - The reported EC was 1.5 dS/m, pH was maintained at 5.5, and all treatments used the same listed micronutrients.
  - Source-water analysis was reported separately and is not added to these treatment targets.
