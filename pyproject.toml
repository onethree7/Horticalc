[project]
name = "horticalc"
version = "0.1.0"
description = "Horticalc (molar-correct) – CSV/YAML Backend"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "fastapi>=0.136.3",
  "pydantic>=2.13.4",
  "uvicorn>=0.49.0",
  "numpy>=1.26.0",
  "tzdata>=2024.1; platform_system == \"Windows\"",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.0.0",
  "pytest>=8",
]

[project.scripts]
horticalc = "horticalc.__main__:main"
horticalc-launcher = "horticalc.launcher:main"

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"frontend" = ["frontend/index.html", "frontend/app.js", "frontend/request_gate.js", "frontend/styles.css"]
"frontend/i18n" = ["frontend/i18n/*.js"]
"data" = ["data/*.csv", "data/*.yml"]
"data/water_profiles" = ["data/water_profiles/*.yml"]
"data/nutrient_solutions" = ["data/nutrient_solutions/*.yml"]
"recipes" = ["recipes/*.yml"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
