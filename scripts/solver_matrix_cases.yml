# N_total and elemental S stay enabled in every case. N-form priority weights
# are intentionally not swept because they are inactive in n_total_only mode.
solver_baseline:
  relative_weighting: false
  overshoot_penalty: 1.0
  irls_max_outer_iter: 4
  scale_eps_mg_per_l: 1.0
  singleton_supplier_enabled: false
  singleton_share_threshold: 0.85
  singleton_max_regress_pp: 0.25
  singleton_underfill_enabled: true
  singleton_underfill_share_threshold: 0.85
  singleton_underfill_max_iter: 2
  nitrogen_objective_mode: n_total_only
  s_objective_enabled: true
  n_total_governor_enabled: false
  n_total_governor_weight: 1.0

# Each group is a controlled experiment. `controls` are explicit off/baseline
# rows; `grid` is a Cartesian product. Settings irrelevant to the active mode
# are not multiplied into redundant rows.
solver_experiments:
  - id: boolean_factorial
    grid:
      relative_weighting: [false, true]
      singleton_supplier_enabled: [false, true]
      singleton_underfill_enabled: [false, true]
      n_total_governor_enabled: [false, true]
  - id: weighting_irls
    grid:
      relative_weighting: [false, true]
      overshoot_penalty: [0.0, 0.25, 1.0, 1.5, 3.0, 10.0]
      irls_max_outer_iter: [0, 1, 2, 4, 8, 12]
  - id: scale_epsilon
    grid:
      relative_weighting: [false, true]
      scale_eps_mg_per_l: [0.1, 0.5, 1.0, 2.0, 5.0]
  - id: singleton_overshoot
    controls:
      - singleton_supplier_enabled: false
    grid:
      singleton_supplier_enabled: [true]
      singleton_share_threshold: [0.0, 0.65, 0.85, 0.95]
      singleton_max_regress_pp: [0.0, 0.25, 1.0, 10.0]
  - id: singleton_underfill
    controls:
      - singleton_underfill_enabled: false
    grid:
      singleton_underfill_enabled: [true]
      singleton_underfill_share_threshold: [0.0, 0.65, 0.85, 0.95]
      singleton_underfill_max_iter: [0, 1, 2, 4, 8]
  - id: n_total_governor
    controls:
      - n_total_governor_enabled: false
    grid:
      n_total_governor_enabled: [true]
      n_total_governor_weight: [0.0, 0.01, 0.05, 0.1, 1.0, 5.0]
  - id: confirmation_best
    variants:
      - relative_weighting: true
        scale_eps_mg_per_l: 0.1
        overshoot_penalty: 10.0
        irls_max_outer_iter: 4
        singleton_supplier_enabled: false
        singleton_underfill_enabled: false
      - relative_weighting: true
        scale_eps_mg_per_l: 0.1
        overshoot_penalty: 10.0
        irls_max_outer_iter: 4
        singleton_supplier_enabled: true
        singleton_share_threshold: 0.0
        singleton_max_regress_pp: 10.0
        singleton_underfill_enabled: false
      - relative_weighting: true
        scale_eps_mg_per_l: 0.1
        overshoot_penalty: 10.0
        irls_max_outer_iter: 4
        singleton_supplier_enabled: true
        singleton_share_threshold: 0.85
        singleton_max_regress_pp: 10.0
        singleton_underfill_enabled: false
      - relative_weighting: true
        scale_eps_mg_per_l: 0.1
        overshoot_penalty: 3.0
        irls_max_outer_iter: 4
        singleton_supplier_enabled: false
        singleton_underfill_enabled: false
      - relative_weighting: true
        scale_eps_mg_per_l: 0.1
        overshoot_penalty: 10.0
        irls_max_outer_iter: 2
        singleton_supplier_enabled: false
        singleton_underfill_enabled: false
      - relative_weighting: true
        scale_eps_mg_per_l: 0.1
        overshoot_penalty: 10.0
        irls_max_outer_iter: 4
        singleton_supplier_enabled: false
        singleton_underfill_enabled: true
        singleton_underfill_share_threshold: 0.85
      - relative_weighting: true
        scale_eps_mg_per_l: 0.1
        overshoot_penalty: 10.0
        irls_max_outer_iter: 4
        singleton_supplier_enabled: true
