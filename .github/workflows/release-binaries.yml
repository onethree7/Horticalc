name: Release binaries

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install -e .
          python -m pip install pyinstaller

      - name: Build binary
        run: pyinstaller scripts/packaging/horticalc.spec --noconfirm --clean

      - name: Package artifact (Linux)
        if: runner.os == 'Linux'
        run: |
          tar -czf horticalc-${{ runner.os }}.tar.gz -C dist horticalc

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path dist\\horticalc -DestinationPath horticalc-${{ runner.os }}.zip
        shell: powershell

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: horticalc-${{ runner.os }}
          path: |
            horticalc-${{ runner.os }}.tar.gz
            horticalc-${{ runner.os }}.zip

      - name: Upload release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            horticalc-${{ runner.os }}.tar.gz
            horticalc-${{ runner.os }}.zip
