conversion_notes:
  - Mineral targets are calculated from the original 1962 formulation rather than the differing Na and Cu values in the 2020 comparison table.
  - Targets cover the mineral nutrient component; vitamins, organics, and sucrose are outside HortiCalc's nutrient target schema.
  - Iodine and cobalt are documented by the source but are outside HortiCalc's target schema.
  - van Delden et al. (2020), DOI 10.1186/s13007-020-00606-4, supplies the deep-water-culture warning.
  - This remains available as a tissue-culture medium; it is not a general hydroponic target.
