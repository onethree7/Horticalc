conversion_notes:
  - Table 1 reports elemental concentrations directly in mg/L, so no sulfate-to-sulfur or other mass conversion is applied.
  - Nitrogen is assigned to N_NO3 because the table reports nitrate-only nitrogen sources.
  - The experiment used tap water; Table 1 does not state whether its background nutrient contribution is included in the listed concentrations.
  - Chemical source names and brands shown in Table 1 are provenance context, not solver targets, and are intentionally not stored here.
  - The micronutrient values are Fe 5.00, Cu 0.02, Zn 0.11, Mn 0.62, B 0.44, and Mo 0.10 mg/L.
