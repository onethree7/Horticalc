conversion_notes:
  - Original N3 table values are N 250, K 300, Ca 250, P 56, Mg 45, B 0.4, and Zn 0.35 ppm.
  - The paper identifies N3 as the highest-yielding treatment for both tested cultivars.
  - Nitrogen form is not assigned because table 1 reports only total N, even though the listed nitrogen sources are nitrate salts.
  - S, Na, Cl, Cu, and Mo were explicitly excluded by the authors; unreported Fe and Mn are also omitted rather than assumed zero.
